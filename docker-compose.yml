version: '3.8'

services:
  backend:
    build: ./backend
    container_name: neuronx-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/neuronx
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/app:/app/app
    networks:
      - neuronx-network

  frontend:
    build: ./frontend
    container_name: neuronx-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    networks:
      - neuronx-network

  db:
    image: postgres:15-alpine
    container_name: neuronx-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=neuronx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - neuronx-network

  redis:
    image: redis:7-alpine
    container_name: neuronx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - neuronx-network

volumes:
  postgres_data:
  redis_data:

networks:
  neuronx-network:
    driver: bridge
